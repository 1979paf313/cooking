<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ee"><title>Kitchen Notes · Recipes</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<header class="topbar"><div class="mark">KN</div><div class="brand"><b>Kitchen Notes</b><small>Our family recipes</small></div><button id="browseBtn" class="icon-button" aria-label="Browse recipes">☰</button></header>
<main><section class="browse" id="browse"><div class="eyebrow">YOUR RECIPE BOX</div><h1>What are we making?</h1><input id="search" type="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes"><div id="recipeList" class="recipe-list"></div><p class="muted tiny">Five recipes in this prototype. More can be added later.</p></section>
<section class="detail hidden" id="detail"><button class="back subtle" id="backBtn">← All recipes</button><div class="eyebrow" id="category"></div><h1 id="recipeTitle"></h1><p class="subtitle" id="desc"></p><div class="meta" id="meta"></div>
<div class="scale-card"><div class="scale-header"><strong>Make it your size</strong><button id="resetScale" class="text-button">Reset</button></div><div class="segmented" id="scaleModes"><button class="active" data-mode="multiplier">Multiplier</button><button data-mode="ingredient">Main ingredient</button><button data-mode="servings">Servings</button></div><div id="scaleControls" class="scale-controls"></div><div id="scaleMessage" class="muted tiny"></div></div>
<div class="tabs"><button class="active" id="fullTab">Full recipe</button><button id="cookTab">Cook mode →</button></div><div id="fullContent"></div><button class="primary wide start" id="startCook">Start cooking →</button></section>
<section class="cook hidden" id="cook"><div class="cook-top"><button id="exitCook" class="subtle">← Recipe</button><span id="cookCount"></span></div><div class="progress"><span id="progressBar"></span></div><div class="cook-phase" id="cookPhase"></div><article class="step-card"><div class="eyebrow" id="cookStepLabel"></div><h2 id="cookInstruction"></h2><div id="stepIngredients"></div><div id="stepExtra"></div></article><div class="next-preview" id="nextPreview"></div><div class="cook-actions"><button id="prevStep" class="secondary">← Previous</button><button id="nextStep" class="primary">Next →</button></div><p class="tiny muted cook-hint">Swipe left/right to change steps. Quantity cards reflect your selected scale.</p></section>
</main><footer>Made for real dinners, not perfect recipes.</footer></div><script src="bundled-recipes.js"></script><script src="app.js"></script></body></html>
